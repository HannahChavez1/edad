<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de edad</title>
</head>
<body>

    <h1>Verificador de edad</h1>

    <label for="edadInput">Ingresa tu edad:</label>
    <input type="number" id="edadInput" placeholder="Ej. 25">
    
    <button onclick="verificarEdad()">Verificar</button>

    <script>
        function verificarEdad() {
            let input = document.getElementById("edadInput");
            let valorIngresado = input.value;
            if (valorIngresado.trim() === "") {
                alert("Por favor, ingresa tu edad.");
            } 
            else {
                let edad = Number(valorIngresado);

                if (isNaN(edad) || edad < 0) {
                    alert("Por favor, ingresa un número válido y mayor o igual a cero.");
                } 
                else if (edad < 18) {
                    alert("Eres menor de edad");
                } 
                else {
                    alert("Eres mayor de edad");
                }
            }
        }
    </script>

</body>
</html>
